# mjbase 定版检查：CI 钉的 mjbase ref 落后于 luiox/mjbase main 时，
# 自动抬 ref 并开 PR，消灭人工盯梢的 pin-bump 循环。
#
# 触发：每日定时兜底 + 手动 + mjbase 仓 push main 后的 repository_dispatch
# （需 mjbase 侧配置 MJT_DISPATCH_TOKEN 指回本仓；未配置时定时兜底照常）。
# 行为：取 ci.yml 中 Checkout mjbase 的 ref 与 mjbase main HEAD 比对；一致则
# 空跑；不一致则重建 bot/mjbase-pin-bump 分支并开/更新 PR（未合并期间重复
# 触发会幂等地重建同内容分支，PR 自动跟随）。

name: mjbase pin check

on:
  schedule:
    - cron: "0 1 * * *" # 每日 UTC 01:00（北京时间 09:00）
  workflow_dispatch:
  repository_dispatch:
    types: [mjbase-main-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mjbase-pin-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Extract pinned mjbase ref
        id: pin
        run: |
          sha=$(grep -m1 -oE 'ref: [0-9a-f]{40}' .github/workflows/ci.yml | awk '{print $2}')
          if [ -z "$sha" ]; then
            echo "::error::ci.yml 中未找到 40 位 mjbase 定版 ref"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Read mjbase main HEAD
        id: head
        run: |
          git clone --depth 1 https://github.com/luiox/mjbase.git mjbase-tmp
          echo "sha=$(git -C mjbase-tmp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git -C mjbase-tmp log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Bump pin and open PR
        if: steps.pin.outputs.sha != steps.head.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.pin.outputs.sha }}
          NEW: ${{ steps.head.outputs.sha }}
          SUBJ: ${{ steps.head.outputs.subject }}
        run: |
          short_new="${NEW:0:7}"
          branch=bot/mjbase-pin-bump
          git push origin --delete "$branch" 2>/dev/null || true
          git config user.name "mjt-pin-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          sed -i "s/$OLD/$NEW/g" .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git commit -m "ci: mjbase ref 抬 ${short_new}（${SUBJ}）"
          git push origin "$branch"
          gh pr create \
            --title "ci: mjbase ref 抬 ${short_new}" \
            --body "mjbase main 前进：**${SUBJ}**

          \`${OLD:0:7}\` → \`${short_new}\`

          由 mjbase pin check 工作流自动开启；合并前确认 mjbase 侧 CI 已绿。" \
            --base main --head "$branch" \
            || echo "::notice::PR 已存在，分支已更新并自动跟随"
